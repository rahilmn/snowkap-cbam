name: CI

# Public PR gate: must pass with no secrets configured, on any fresh
# clone/fork. Runs: install -> typecheck -> start a local, disposable
# Supabase stack (so the cross-org isolation suites run for real
# instead of self-skipping -- see the "Start local Supabase" step's
# own comment, P11 finding #11) -> unit/integration tests -> stop that
# stack -> build -> Playwright smoke suite against that build (the
# health-check smoke test also self-skips without credentials, see
# tests/e2e/shell.spec.ts) -> secret scan.
# pnpm regulatory:verify is NOT run here — it requires a Python
# environment plus live database credentials (SUPABASE_DB_PASSWORD) and
# remains a locally-run / manually-dispatched gate per
# docs/architecture/ARCHITECTURE.md.

# 2026-09-02. This used to be `push: branches: [main]` only. Railway
# deploys production from `feature/full-product-build`, so NO CI run had
# ever executed against the commit actually serving production --
# `gh run list --branch feature/full-product-build` was empty, and every
# gate had only ever run on one developer's machine. That is precisely
# how a CRITICAL determination-validator defect (B1) reached production
# with a green local suite.
#
# `branches: ['**']` rather than naming the deploy branch: the deploy
# branch is a Railway dashboard setting this repository cannot see, so
# naming it here would silently rot the moment it changed. Running on
# every branch push is the only form that stays correct without knowing
# which branch is deployed -- and it is strictly safer, not weaker.
#
# `concurrency` keeps the cost of that honest: a newer push to the same
# ref cancels the older in-flight run, so this does not pile up. It does
# NOT cancel across refs, so a push to the deploy branch can never be
# cancelled by unrelated work.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 2026-09-02. Split out of build-and-test so that the gates which need
  # NO container images actually report against the deployed commit.
  #
  # Why: `supabase start` pulls ~10 images from public.ecr.aws, which
  # rate-limits GitHub-hosted runners' shared egress IPs. Three
  # consecutive runs failed there -- before typecheck's result was even
  # visible -- so an infrastructure limit was masking the status of every
  # other gate on the commit serving production.
  #
  # This does NOT weaken anything. build-and-test below still runs the
  # full suite against real Supabase and is still required; nothing was
  # made non-blocking, and no check was removed or relaxed. The split
  # only means an external registry outage can no longer hide whether
  # typecheck, the unit suites, the production build and the secret scan
  # pass on the deployed commit.
  fast-gates:
    name: Typecheck, unit tests, build, secret scan (no containers)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The Supabase-backed suites self-skip here by design; they run for
      # real in build-and-test below. This step therefore proves the pure
      # domain/application/architecture suites pass, and does not claim
      # to cover the integration ones.
      - name: Unit / domain / architecture tests
        run: pnpm test

      # The build needs these two PRESENT (browser-client.ts /
      # server-client.ts do a bare `!url || !anonKey` check -- no format
      # validation), because pages such as app/page.tsx construct a
      # Supabase client during prerendering. build-and-test below gets
      # them from `supabase status`; this job has no Supabase, so it
      # supplies deliberately NON-FUNCTIONAL placeholders.
      #
      # They are obviously fake by construction and are not JWT-shaped,
      # so they cannot be mistaken for credentials and do not trip the
      # secret scan below. Nothing in a build talks to Supabase -- this
      # job proves the bundle COMPILES, and makes no claim about runtime
      # connectivity, which build-and-test covers for real.
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          # 2026-09-04 (P14, AUTH-1). Required at runtime: it seals the
          # server-side session store. A placeholder is right here --
          # this job proves the bundle COMPILES and talks to nothing.
          APP_SESSION_SECRET: ci-placeholder-app-session-secret-not-real
        run: pnpm build

      - name: Scan for committed secrets
        # 2026-09-03 (P14 blockers B3 + B4). Was two divergent inline
        # shell scans. The build-and-test copy referenced an undefined
        # variable, which `set -u` turned into a fatal that the
        # trailing `|| true` then swallowed, so it printed its success
        # string and exited 0 on every run since 464d6d8 -- while the
        # fast-gates copy had never carried the SUPABASE_*= or
        # postgres:// rules at all. Between them, no job in this
        # pipeline could catch a committed database password.
        #
        # One Node implementation, called by both jobs. An undefined
        # name is now a ReferenceError that kills the process instead
        # of an empty expansion, and the script self-tests both
        # directions before it looks at the repository, so a clean
        # report means the scanner proved it still works.
        run: node scripts/ci/scan-for-committed-secrets.mjs
  build-and-test:
    name: Typecheck, test, build, smoke, secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 2026-08-29 (P11 mandatory security review, finding #11,
      # SHOULD-FIX, confirmed live): the 89 tests every one of P11's
      # own reviewers found skipped in `pnpm test` are precisely
      # tests/integration/{organizations,shipments,sharing-grants,
      # declarations,shared-data-*}-isolation.test.ts -- the standing
      # regression coverage every prior phase's review wrote to lock
      # in its own found-and-fixed cross-org bug (master plan §13:
      # "a standing test, not an assumption... from P3 on every new
      # port/policy"). They self-skip cleanly (describe.skipIf) when
      # local Supabase isn't reachable at 127.0.0.1:54321, and this
      # workflow deliberately provided none -- so nothing here would
      # ever catch a regression of any P3/P4/P7/P9/P10/P11 isolation
      # fix. `supabase` is already a package.json devDependency
      # (`pnpm exec supabase`, no separate setup action needed);
      # `start` applies every migration in supabase/migrations/ plus
      # supabase/seed.sql (the local-only base-table grants, per that
      # file's own header comment) against a fresh local Postgres --
      # this needs no secrets: the isolation suites already default to
      # the FIXED, publicly-documented local demo JWTs
      # `supabase start` always prints for a fresh project (see e.g.
      # organizations-isolation.test.ts's own header comment for why
      # those are not secrets), so this stays a true "no secrets
      # configured" public PR gate.
      #
      # The explicit health-check + `exit 1` below (rather than just
      # trusting `supabase start`'s own exit code) closes the second
      # half of this finding's suggested fix: if the stack ever fails
      # to actually become reachable for any reason, this step fails
      # LOUDLY, rather than the isolation suites silently skipping
      # again and the job staying green regardless.
      # 2026-09-02. `supabase start` pulls ~10 container images from
      # public.ecr.aws on a cold runner, and GitHub-hosted runners share
      # egress IPs, so that registry returns `toomanyrequests: Rate
      # exceeded` intermittently. Both of this workflow's first two runs
      # on the deploy branch failed there -- not on any test.
      #
      # The retry below is deliberately scoped to the IMAGE PULL, an
      # external dependency with a known transient failure mode. NOTHING
      # in the test, build or scan steps is retried: a red test is a
      # finding, and re-running until it passes would destroy the signal
      # this workflow exists to provide.
      #
      # If all attempts fail the job still fails LOUDLY, and still fails
      # on the reachability probe rather than letting the isolation
      # suites self-skip into a false green -- the property the original
      # step was written to guarantee is preserved exactly.
      # 2026-09-02. Two independent problems had to be solved to make
      # this gate run at all. Neither weakens, skips or replaces a test.
      #
      # (1) REGISTRY. public.ecr.aws rate-limits GitHub-hosted runners'
      #     shared egress IPs and failed every attempt including three
      #     retries hours apart. SUPABASE_INTERNAL_IMAGE_REGISTRY
      #     redirects the pulls to Docker Hub, which hosts the same
      #     images. Verified working: the run log now shows
      #     docker.io/supabase/* and zero "toomanyrequests".
      #
      # (2) DATASET ORDERING -- the real reason this gate has NEVER
      #     passed in CI. `supabase start` replays every migration in one
      #     pass, and 20260827110000 (a PROTECTED regulatory-foundation
      #     migration) asserts that a DRAFT dataset version
      #     '2026-definitive-corrected' with 12,540 rows already exists:
      #
      #       ERROR: Validated regulatory dataset
      #              2026-definitive-corrected was not found (P0001)
      #
      #     That data is produced by the Python pipeline, which needs a
      #     running database -- which only exists after migrations. On a
      #     fresh database the ordering is circular, so `supabase start`
      #     cannot succeed. The registry limit had been masking this.
      #
      #     Resolved WITHOUT touching the protected zone, by running the
      #     project's own pipeline between the two migration phases: let
      #     the first pass apply the schema migrations, regenerate the
      #     canonical JSON from the TRACKED source workbook, load the
      #     DRAFT dataset, then apply the remaining migrations. Nothing
      #     is fabricated -- the dataset is derived from
      #     data/raw/cbam-default-values-2026-definitive-corrected.xlsx,
      #     which is committed, by scripts/regulatory/*.py, which are
      #     committed.
      - name: Set up Python for the regulatory pipeline
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install regulatory pipeline dependencies
        run: pip install -r scripts/regulatory/requirements.txt

      - name: Start local Supabase and load the regulatory dataset
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
          SUPABASE_DB_PASSWORD: postgres
        run: |
          set -euo pipefail

          # The migration set is not self-sufficient on a fresh database:
          # 20260827110000 (PROTECTED) asserts a DRAFT dataset of 12,540
          # rows already exists, but that data is produced by the Python
          # pipeline, which needs a running database -- which only exists
          # after migrations. `supabase start` runs them all in one pass
          # and TEARS THE STACK DOWN when one fails (confirmed in run
          # 2165415: Postgres was unreachable afterwards), so it cannot be
          # sequenced by letting the first pass fail.
          #
          # Deferring is therefore deterministic rather than opportunistic:
          # apply only the two migrations that CREATE the regulatory
          # tables, load the dataset the project's own pipeline derives
          # from the COMMITTED workbook, then apply the remaining 61.
          # No migration content is edited and no test is skipped,
          # weakened or replaced -- only the order in which the CLI is
          # handed them.
          # supabase/config.toml ships [storage] enabled = false because
          # enabling it made the container report "not ready: unhealthy"
          # on the DEVELOPER's host -- a machine-specific image/Node
          # incompatibility, documented in that file. The consequence is
          # that storage.buckets never exists, so four storage-touching
          # migrations cannot apply and were marked applied via
          # `supabase migration repair`; their storage.objects policies
          # are, in this repo's own words, "shim-verified only".
          #
          # A clean ubuntu-latest runner is not that host, so Storage is
          # enabled HERE ONLY. If it comes up, those four migrations
          # apply for real and the evidence-storage RLS is genuinely
          # exercised. The committed default is untouched.
          # 2026-09-03 (Phase 2 review): the awk edit and Storage itself
          # are now ASSERTED, not printed. Previously this step only
          # `grep`ped the result, so a silent revert to `enabled = false`
          # -- or a Storage container that came up unhealthy -- left the
          # storage-touching migrations unapplied while the job stayed
          # green, and producer-journey.spec.ts's live probe simply took
          # its disabled branch. That is green-by-omission on the exact
          # controls 20260829510000 exists for.
          awk '/^\[storage\]/{s=1} s&&/^enabled *= *false/{sub(/false/,"true"); s=0} {print}'             supabase/config.toml > /tmp/config.toml && mv /tmp/config.toml supabase/config.toml
          if ! sed -n '/^\[storage\]/,/^\[/p' supabase/config.toml | grep -q '^enabled = true'; then
            echo "::error::The [storage] section was not switched to enabled = true -- the awk edit did not apply."
            exit 1
          fi

          mkdir -p /tmp/deferred
          for f in supabase/migrations/*.sql; do
            case "$(basename "$f")" in
              20260826133116_*|20260827093000_*) ;;
              *) mv "$f" /tmp/deferred/ ;;
            esac
          done
          echo "applying $(ls supabase/migrations/*.sql | wc -l) schema migrations first; $(ls /tmp/deferred/*.sql | wc -l) deferred"

          pnpm exec supabase start

          if ! curl -sf --max-time 5 http://127.0.0.1:54321/auth/v1/health >/dev/null; then
            echo "::error::Local Supabase did not come up reachable at 127.0.0.1:54321."
            exit 1
          fi

          # Regenerate the canonical dataset from the COMMITTED workbook.
          python scripts/regulatory/parse-definitive-default-values.py

          mkdir -p supabase/.temp
          printf 'postgresql://postgres@127.0.0.1:54322/postgres' > supabase/.temp/pooler-url
          python scripts/regulatory/load-definitive-default-values.py

          # Restore and apply the remaining migrations, activation first.
          mv /tmp/deferred/*.sql supabase/migrations/
          pnpm exec supabase migration up --local

          # seed.sql runs as the LAST step of `supabase start`, which
          # here was when only two migrations existed -- so the 61 tables
          # created by the second pass never received the base-table
          # grants it exists to replicate, and the isolation suites
          # failed with "permission denied for table ...". Re-applying it
          # now covers every table. This is a consequence of the
          # deferral, not a pre-existing defect, and seed.sql is
          # idempotent (grants only).
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

          # 2026-09-03 (P14 remediation). Run the database-posture
          # acceptance check that BACKUP_RESTORE.md and DEPLOYMENT.md
          # both name as the acceptance test for a restore -- which,
          # until now, no CI job had ever invoked. The P14 review found
          # it printing "RESULT: POSTURE MATCHES" on a database with the
          # P14.1 calculation-write boundary fully reverted, and nothing
          # would have caught that, because nothing ran it.
          #
          # Running it HERE is the whole point: this is the moment
          # seed.sql's blanket grants have just executed over a freshly
          # migrated database, which is exactly the sequence that
          # silently reopened those revokes once already. The check
          # includes privilege_invariants_hold, which reads the registry
          # every revoke-migration writes to, so a future revoke is
          # covered without editing either this workflow or the script.
          node scripts/ops/compare-database-posture.mjs --check             "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          ACTIVE=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from public.default_emission_values dev join public.regulatory_datasets rd on rd.id=dev.dataset_id where rd.status='ACTIVE'" | tr -d '[:space:]')
          echo "ACTIVE regulatory rows: ${ACTIVE}"
          if [ "${ACTIVE}" != "12540" ]; then
            echo "::error::Expected 12540 ACTIVE regulatory rows, found ${ACTIVE} -- the regulatory suites would run against wrong data."
            exit 1
          fi

          if ! curl -sf --max-time 5 http://127.0.0.1:54321/auth/v1/health >/dev/null; then
            echo "::error::Local Supabase not reachable after the second migration pass."
            exit 1
          fi

          # Storage must be genuinely up, or the evidence-storage RLS and
          # bucket-limit tests silently do not run. 503 is what an
          # unhealthy/absent Storage container returns through Kong.
          STORAGE_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:54321/storage/v1/bucket || echo "000")
          echo "storage/v1/bucket -> ${STORAGE_CODE}"
          if [ "${STORAGE_CODE}" = "503" ] || [ "${STORAGE_CODE}" = "000" ]; then
            echo "::error::Supabase Storage is not available (HTTP ${STORAGE_CODE}) -- the evidence-storage security tests would not run."
            exit 1
          fi

          # storage.buckets must exist for the four storage-touching
          # migrations to have applied for real rather than been shimmed.
          BUCKETS=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from storage.buckets where id = 'evidence'" | tr -d '[:space:]')
          if [ "${BUCKETS}" != "1" ]; then
            echo "::error::The 'evidence' storage bucket does not exist (found ${BUCKETS}) -- 20260829510000's limits are not in force."
            exit 1
          fi
          echo "Local Supabase is reachable, Storage is up, the evidence bucket exists and the ACTIVE dataset is loaded."

      # 2026-09-03 (Phase 2 review). This step previously ran with NO
      # Supabase environment, so tests/integration/regulatory-repository
      # .test.ts (10 tests) and regulatory-resolution.test.ts (4) --
      # gated on SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY, and the ONLY
      # coverage of the protected regulatory adapter and resolver against
      # a real database -- have never executed in CI. .env.local is
      # written later and only for Playwright, and vitest reads no
      # .env file. Supplying the local values here runs them against the
      # 12,540-row ACTIVE dataset this job just loaded, which is the
      # exact dataset their assertions name. Values come from
      # `supabase status -o env` via eval, so nothing is printed.
      - name: Test
        run: |
          set -euo pipefail
          eval "$(pnpm exec supabase status -o env)"
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          pnpm test

      # 2026-08-31 (P13 remaining-findings review). This step used to sit
      # HERE, before Playwright ran -- so every Playwright job in this
      # repository's history executed with no Supabase backend. The three
      # journey specs (importer, producer, cross-org sharing) self-skip
      # without one, which means they have never actually been green in
      # CI: the job passed because they did not run, not because they
      # worked. It now runs AFTER Playwright, at the bottom of this job.

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts resolves the app's Supabase credentials from
      # .env.local, then .env -- neither of which exists on a CI runner,
      # so without this the specs would still self-skip even with
      # Supabase up. These are the local demo credentials `supabase
      # start` generates: they are identical on every machine that has
      # ever run it, are already allowlisted in this workflow's own
      # secret scan below for exactly that reason, and grant nothing
      # beyond the ephemeral container this job just started. Written
      # with `>>` from `supabase status -o env` rather than echoed, so no
      # value is printed to the job log.
      - name: Write .env.local for the E2E app build (local Supabase)
        run: |
          set -euo pipefail
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            # 2026-09-03 (P14.3). Required, not cosmetic. The E2E runs a
            # PRODUCTION build, and checkAppUrl() reports "missing" when
            # APP_URL is absent under NODE_ENV=production -- which makes
            # /api/health return degraded/503 and fails the health-check
            # E2E. That check exists because a deploy without APP_URL
            # emails http://localhost:3000 confirmation, reset and invite
            # links to every real user while every other check still
            # reads "ok" (see src/application/health/check-app-url.ts).
            # It was reporting a genuine gap in this job's environment
            # the moment the test was allowed to run.
            echo "APP_URL=http://localhost:3000"
            # 2026-09-04 (P14, AUTH-1). Required, and required to be a
            # real value rather than a placeholder: it is the key the
            # server-side session store is sealed with, so without it
            # the app refuses to hold a session at all and every
            # authenticated journey fails at sign-in.
            #
            # Generated per run. Sessions do not outlive a CI job, and a
            # per-run key means a leaked workflow log cannot open a
            # session store from any other run.
            echo "APP_SESSION_SECRET=$(openssl rand -hex 32)"
          } >> .env.local
          echo "Wrote .env.local pointing at the local Supabase this job started."

          # 2026-09-03 (P14.3). .env.local is a FILE the app build reads.
          # The Playwright runner's own process never saw these, and
          # shell.spec.ts gates its health-check test on
          # `Boolean(process.env.SUPABASE_URL && process.env.SUPABASE_SERVICE_ROLE_KEY)`
          # -- so that test skipped itself in CI on BOTH projects, while
          # passing locally for anyone who exports the pair in their
          # shell. The release gate protocol requires it to RUN.
          #
          # This is the same "green by omission" the comment below
          # describes for the journey specs: that gap was closed by
          # starting Supabase for this step, and the health check was
          # left behind because nothing failed when it skipped.
          #
          # Only the local demo credentials -- the fixed values
          # `supabase status` prints on every machine, already committed
          # verbatim in this repository's own test files.
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
          echo "Exported SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY so the health-check E2E runs."

      # Builds the app and runs the WHOLE Playwright suite against it
      # (playwright.config.ts's webServer builds+starts the app itself).
      #
      # Comment rewritten 2026-08-31: it previously said "No Supabase
      # secrets are configured here -- the health-check test skips itself
      # accordingly", which was accurate when written and had quietly
      # become the description of a gap. With Supabase now running for
      # this step and .env.local written above, the three journey specs
      # (importer, producer, cross-org sharing) execute for real against
      # a live local backend instead of skipping.
      #
      # playwright.config.ts's webServer.env additionally sets the two
      # rate-limit bypass keys, so the suite's own sign-up volume does
      # not self-trip the production limiters. That bypass requires a
      # build-time flag which no production image is ever built with --
      # see src/infrastructure/rate-limit/rate-limiter.ts.
      #
      # Still NOT covered here, stated plainly: E2E against a real
      # STAGING deployment with hosted data (MASTER_PLAN.md §31's
      # secret-bearing gate). This runs against ephemeral local Supabase,
      # which is a genuine backend but not a deployed environment.
      - name: Build and run Playwright suite (smoke + full journeys)
        run: pnpm exec playwright test

      # Moved here 2026-08-31: Supabase must outlive the Playwright run,
      # or the journey specs skip themselves and this job goes green
      # without having tested anything. `if: always()` so the container
      # is still torn down when the suite fails.
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Dependency security audit -- master plan §31 CI/CD pipeline lists
      # this exact stage, in this exact position (after the Playwright
      # smoke suite, before the secret scan): "dependency audit (advisory
      # -> blocking by P11)". We are at P11, so it is now the blocking
      # form, not the advisory form: --audit-level high means pnpm still
      # prints moderate/low/info advisories (so they stay visible in the
      # log) but only exits non-zero -- failing this job -- on a HIGH or
      # CRITICAL finding. Ratcheting the threshold down to moderate is a
      # separate, deliberate decision for a later phase, not a side
      # effect of adding this step.
      #
      # Known open finding as of 2026-08-29 (does not block: severity is
      # moderate, below this gate's threshold): GHSA-w5hq-g745-h8pq (uuid
      # <11.1.1, "missing buffer bounds check in v3/v5/v6 when buf is
      # provided"), pulled in transitively via exceljs@4.4.0 -> uuid@8.3.2.
      # exceljs 4.4.0 is itself the latest published release and still
      # pins "uuid": "^8.3.0" -- there is no upstream exceljs release that
      # clears this, and forcing a uuid bump via a pnpm override would
      # pin exceljs to a uuid major it was never tested against, which is
      # out of scope for a routine dependency-audit pass. Re-evaluate when
      # exceljs ships a release that updates its uuid dependency.
      - name: Dependency security audit (advisory -> blocking by P11)
        run: pnpm audit --audit-level high

      - name: Scan for committed secrets
        # 2026-09-03 (P14 blockers B3 + B4). Was two divergent inline
        # shell scans. The build-and-test copy referenced an undefined
        # variable, which `set -u` turned into a fatal that the
        # trailing `|| true` then swallowed, so it printed its success
        # string and exited 0 on every run since 464d6d8 -- while the
        # fast-gates copy had never carried the SUPABASE_*= or
        # postgres:// rules at all. Between them, no job in this
        # pipeline could catch a committed database password.
        #
        # One Node implementation, called by both jobs. An undefined
        # name is now a ReferenceError that kills the process instead
        # of an empty expansion, and the script self-tests both
        # directions before it looks at the repository, so a clean
        # report means the scanner proved it still works.
        run: node scripts/ci/scan-for-committed-secrets.mjs